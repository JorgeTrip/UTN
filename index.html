<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISI · Jorge O. Tripodi · UTN FRBA</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/disposicion.css"><link rel="stylesheet" href="css/componentes.css"><link rel="stylesheet" href="css/calendario.css"><link rel="stylesheet" href="css/enlaces.css"><link rel="stylesheet" href="css/responsivoEscritorio.css"><link rel="stylesheet" href="css/responsivoMovil.css"><link rel="stylesheet" href="css/menuMovil.css"><link rel="stylesheet" href="css/switchTema.css"><link rel="stylesheet" href="css/modalPerfil.css"><link rel="stylesheet" href="css/modalPlanificador.css">
</head>
<body>

<header class="g-header">
  <div class="g-header-inner">
    <div class="g-logo">
      <div class="g-badge-row"><span class="g-badge gb-utn">UTN · FRBA</span><span class="g-badge gb-k23">Plan K23</span></div>
    </div>
    <div class="g-header-titles">
      <div class="g-title">Ingeniería en Sistemas de Información</div>
      <div class="g-sub">Jorge Osvaldo Tripodi · Leg. 172-060.0 · Turno Noche</div>
    </div>
    <div class="g-right">
      <div class="g-date">Actualizado: 08/03/2026</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px;">
        <div id="avatarWrap" style="position:relative;">
          <button class="avatar-btn-header profile-avatar" onclick="toggleAvatarDropdown(event)" title="Opciones de cuenta">JT</button>
          <div class="avatar-dropdown" id="avatarDropdown">
            <button class="dropdown-item" onclick="abrirModalPerfil()"><span>👤</span> Editar Perfil / Datos</button>
            <button class="dropdown-item" onclick="alternarTema()"><span id="switchTemaIcono">🌙</span> <span id="switchTemaTexto">Modo Oscuro</span></button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item" onclick="exportarDatosAlumno(); cerrarAvatarDropdown();"><span>💾</span> Descargar Backup JSON</button>
            <label class="dropdown-item" style="cursor:pointer;margin:0;"><span>📥</span> Cargar Backup JSON<input type="file" accept=".json" onchange="importarDatosAlumno(event); cerrarAvatarDropdown();" style="display:none;"></label>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="super-tab-bar">
  <div class="super-tab-inner">
    <button class="super-tab sp0 active" onclick="superTab(0)">🔗 Links Útiles</button>
    <button class="super-tab sp1" onclick="superTab(1)">🏆 Plan de Estudios & Seguimiento</button>
    <button class="super-tab sp2" onclick="superTab(2)">🗓️ Planificador Cuatrimestral</button>
  </div>
</div>

<main id="sp0" class="super-panel active"></main>

<main id="sp1" class="super-panel">
  <div class="sub-tab-bar">
    <div class="sub-tab-inner">
      <button class="sub-tab active" onclick="sp1Tab(0)">🏆 Hitos & KPIs</button>
      <button class="sub-tab" onclick="sp1Tab(1)">🗺️ Mapa Curricular K23</button>
      <button class="sub-tab" onclick="sp1Tab(2)">📐 Peso Académico UTN</button>
      <button class="sub-tab" onclick="sp1Tab(3)">🚀 Estrategia & Correlatividades</button>
    </div>
  </div>
  <div class="sub-panel active" id="sp1p0"></div>
  <div class="sub-panel" id="sp1p1"></div>
  <div class="sub-panel" id="sp1p2"></div>
  <div class="sub-panel" id="sp1p3"></div>
</main>

<main id="sp2" class="super-panel"></main>
<main id="sp3" class="super-panel"><div class="materia-iframe-container" id="materiaViewContainer"><iframe id="materiaIframe" src="about:blank"></iframe></div></main>

<!-- Modales del Sistema -->
<div class="modal-overlay" id="modalPerfil">
  <div class="modal-card">
    <div class="modal-header"><div class="modal-title">👤 Editar Perfil de Estudiante</div><button class="modal-close" onclick="cerrarModalPerfil()">&times;</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Nombre Completo</label><input type="text" id="profNombre" class="form-input"></div>
        <div class="form-group"><label class="form-label">Legajo SIU</label><input type="text" id="profLegajo" class="form-input"></div>
        <div class="form-group"><label class="form-label">Año de Ingreso</label><input type="text" id="profIngreso" class="form-input"></div>
        <div class="form-group"><label class="form-label">Turno Cursada</label><select id="profTurno" class="form-input"><option value="Noche">Noche</option><option value="Mañana">Mañana</option><option value="Tarde">Tarde</option></select></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn-sec" onclick="cerrarModalPerfil()">Cancelar</button><button class="btn-prim" onclick="guardarDatosPerfil()">Guardar Cambios</button></div>
  </div>
</div>

<div class="modal-overlay" id="modalMateria">
  <div class="modal-card">
    <div class="modal-header"><div class="modal-title">✏️ Modificar Materia: <span id="editNombreMateria" style="color:var(--blue)">-</span></div><button class="modal-close" onclick="cerrarModalEditarMateria()">&times;</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Estado Académico</label><select id="selectEstadoMateria" class="form-input"><option value="aprobada">Aprobada (Promoción Directa o Final Aprobado)</option><option value="firmada">Firmada (Cursada Aprobada / Rinde Final)</option><option value="equivalencia">Homologada por Equivalencia K08→K23</option><option value="en_curso">En Curso (Cursando)</option><option value="pendiente">Sin Cursar (Materia Pendiente)</option></select></div>
        <div class="form-group"><label class="form-label">Modalidad Aprobación</label><select id="selectModalidadMateria" class="form-input"><option value="promocion">Promoción Directa</option><option value="final">Examen Final</option><option value="equivalencia_k08">Equivalencia Plan K08→K23</option><option value="equivalencia_carrera">Equivalencia Pase Carrera</option></select></div>
        <div class="form-group"><label class="form-label">Nota (1-10)</label><input type="number" min="1" max="10" id="inputNotaMateria" class="form-input" placeholder="Ej: 9"></div>
        <div class="form-group"><label class="form-label">Fecha Aprobación</label><input type="text" id="inputFechaAprobacion" class="form-input" placeholder="AAAA-MM-DD"></div>
      </div>
      <div id="seccionEvaluacionesModal"></div>
    </div>
    <div class="modal-footer"><button class="btn-sec" onclick="cerrarModalEditarMateria()">Cancelar</button><button class="btn-prim" onclick="guardarEdicionMateria()">Guardar Materia</button></div>
  </div>
</div>

<!-- Modal Selección de Materias Electivas -->
<div class="modal-overlay" id="modalElectiva">
  <div class="modal-card" style="max-width:520px;">
    <div class="modal-header"><div class="modal-title">➕ Seleccionar Materia Electiva (<span id="txtNivelElectiva" style="color:var(--blue)">Nivel 3</span>)</div><button class="modal-close" onclick="cerrarModalElectiva()">&times;</button></div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:12px;">
        <label class="form-label">Oferta de Materias Electivas Institucionales</label>
        <select id="selectMateriaElectiva" class="form-input" onchange="actualizarInfoElectivaSeleccionada()"></select>
      </div>
      <div id="boxInfoElectiva" style="background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px;font-size:12px;">
        <div style="font-weight:700;font-size:13px;margin-bottom:4px;" id="infoElectivaNombre">-</div>
        <div style="color:var(--blue);font-family:'JetBrains Mono',monospace;margin-bottom:6px;" id="infoElectivaCarga">-</div>
        <div style="color:var(--muted);line-height:1.5;" id="infoElectivaDesc">-</div>
      </div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Estado Académico</label><select id="selectEstadoElectiva" class="form-input"><option value="aprobada">Aprobada</option><option value="en_curso">En Curso</option><option value="planificada">Planificada</option></select></div>
        <div class="form-group"><label class="form-label">Nota (1-10)</label><input type="number" min="1" max="10" id="inputNotaElectiva" class="form-input" placeholder="Ej: 10"></div>
        <div class="form-group" style="grid-column:1/-1;"><label class="form-label">Fecha Aprobación / Cursada</label><input type="text" id="inputFechaElectiva" class="form-input" placeholder="AAAA-MM-DD"></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn-sec" onclick="cerrarModalElectiva()">Cancelar</button><button class="btn-prim" onclick="guardarMateriaElectivaModal()">Guardar Electiva</button></div>
  </div>
</div>

<script src="js/switchTema.js"></script><script src="js/cargadorDatos.js"></script><script src="js/calculadorNotas.js"></script><script src="js/gestorEvaluacionesMateria.js"></script><script src="js/navegacion.js"></script><script src="js/gestorPlanificador.js"></script><script src="js/modalPlanificador.js"></script><script src="js/constructorCalendario.js"></script><script src="js/renderizadorLinks.js"></script><script src="js/renderizadorHitos.js"></script><script src="js/renderizadorMapa.js"></script><script src="js/renderizadorPeso.js"></script><script src="js/renderizadorEstrategia.js"></script><script src="js/renderizadorPlanificador.js"></script><script src="js/renderizadorUI.js"></script><script src="js/chevronesDesplazamiento.js"></script><script src="js/gestorAlumno.js"></script><script src="js/menuMovil.js"></script><script src="js/modalPerfil.js"></script><script src="js/modalMateria.js"></script><script src="js/inicializador.js"></script>
</body>
</html>

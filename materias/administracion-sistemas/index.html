<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASI 2026 – Administración de Sistemas de Información</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script>
  if (window.self !== window.top) {
    document.documentElement.classList.add('in-iframe');
  }
</script>
<style>
  html.in-iframe header { display: none !important; }
  html.in-iframe main { padding-top: 10px !important; }

  :root {
    --bg: #0b0f1a;
    --surface: #111827;
    --card: #161d2e;
    --border: #1e2d45;
    --accent: #2f80ed;
    --accent2: #00c9a7;
    --accent3: #f5a623;
    --danger: #e74c3c;
    --text: #e8edf5;
    --muted: #6b7fa3;
    --highlight: #253450;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    position: relative;
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    background: linear-gradient(180deg, #0d1526 0%, var(--bg) 100%);
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 0;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .logo-block { display: flex; align-items: center; gap: 1rem; }

  .utn-badge {
    background: var(--accent);
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .header-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    line-height: 1.2;
    color: var(--text);
  }
  .header-title span { color: var(--accent); }

  .header-meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.2rem;
    font-family: 'DM Mono', monospace;
  }

  .header-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(255,255,255,0.06);
    color: var(--text);
    text-decoration: none;
    padding: 0.5rem 0.9rem;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 400;
    transition: background 0.2s, transform 0.15s;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .header-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
  .header-btn.btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
    position: relative;
    z-index: 1;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: #bae6fd;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-block">
      <span class="utn-badge">UTN · FRBA</span>
      <div>
        <div class="header-title"><span>ASI</span> — Administración de Sistemas de Información <span>K4053</span></div>
        <div class="header-meta">4to año · Turno Noche · Jueves · 2026</div>
      </div>
    </div>
    <div class="header-actions" style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">
      <a href="../../index.html" class="back-btn" title="Volver al Panel Principal">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Volver al Panel</span>
      </a>
      <a href="https://aulasvirtuales.frba.utn.edu.ar/course/view.php?id=29430" target="_blank" class="header-btn">Aula Virtual</a>
      <a href="https://utn.zoom.us/j/87867339780" target="_blank" class="header-btn btn-primary">Unirse a Zoom</a>
    </div>
  </div>
</header>

<main>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;margin-top:1rem;">
    <h2 style="font-family:'Syne',sans-serif;font-size:1.4rem;margin-bottom:1rem;color:var(--accent);">Administración de Sistemas de Información</h2>
    <p style="color:var(--muted);line-height:1.6;">Asignatura Anual de 4º Nivel · Comisión K4053 · UTN FRBA Medrano.</p>
  </div>
</main>
</body>
</html>

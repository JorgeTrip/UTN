name: CI-CD Auto Bumping y Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/changelog.json'
      - 'data/version.json'
      - 'package.json'

permissions:
  contents: write

jobs:
  versionar-y-publicar:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas automáticas
        run: npx playwright install --with-deps chromium && npm run e2e

      - name: Generar Changelog y Versionado Semántico
        run: node tools/generarChangelog.mjs

      - name: Commitear cambios sin conflictos (Anti-conflict Rebase)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/version.json data/changelog.json package.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: Se actualiza changelog y version automatica [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Sin cambios en el versionado."
          fi
